services:
  - type: web
    name: riftchallenge-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RIOT_API_KEY
        sync: false
      - key: RIOT_PLATFORM
        value: euw1
      - key: RIOT_REGIONAL_ROUTING
        value: europe
      - key: CORS_ORIGINS
        sync: false
      - key: HIKARI_MAX_POOL_SIZE
        value: "3"
      - key: HIKARI_MIN_IDLE
        value: "1"
