services:
  - type: web
    name: riftrace-backend
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/riftrace-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RIOT_API_KEY
        sync: false
      - key: RIOT_PLATFORM
        value: euw1
      - key: RIOT_REGIONAL_ROUTING
        value: europe
      - key: CORS_ORIGINS
        sync: false
