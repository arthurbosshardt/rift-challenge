name: Keep backend warm

# Render's free tier spins the API down after ~15 min of inactivity, which can leave
# Googlebot (and real visitors) hitting a cold start of 2-3 minutes. Pinging the health
# endpoint periodically keeps an instance warm. No app code involved, purely operational.
#
# GitHub doesn't guarantee scheduled workflows run on time — under load, a run can be
# delayed by several minutes (GitHub's own docs warn schedules "may be delayed during
# periods of high loads"). A */10 schedule leaves almost no buffer against Render's
# 15-min timeout, so a single delayed run lets the instance sleep anyway. */5 keeps a
# comfortable margin even when a run or two slips.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.RENDER_HEALTH_URL }}" ]; then
            echo "::warning::RENDER_HEALTH_URL repository variable is not set (Settings > Secrets and variables > Actions > Variables). Skipping ping."
            exit 0
          fi
          curl -fsS --max-time 180 "${{ vars.RENDER_HEALTH_URL }}"
