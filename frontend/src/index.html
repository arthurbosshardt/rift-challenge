<!doctype html>
<html lang="fr" data-theme="dark">

    <meta charset="utf-8" />

    <meta property="og:type" content="website" />

      property="og:description"
      content="Rift Challenge — défis SoloQ et DuoQ League of Legends entre amis : créez un challenge, suivez les LP et le classement."

    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('riftchallenge.theme') || localStorage.getItem('riftrace.theme');
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
