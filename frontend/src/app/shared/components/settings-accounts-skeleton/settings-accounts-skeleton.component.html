<div class="settings-accounts-skeleton" role="status" aria-live="polite">
  <app-skeleton height="0.875rem" maxWidth="8rem" />
  <app-skeleton height="0.75rem" maxWidth="14rem" />

  <div class="settings-accounts-skeleton__account">
    <app-skeleton [circle]="true" width="2.75rem" height="2.75rem" />
    <div class="settings-accounts-skeleton__copy">
      <app-skeleton height="0.9375rem" maxWidth="10rem" />
      <app-skeleton height="0.8125rem" maxWidth="7rem" />
    </div>
  </div>

  <div class="settings-accounts-skeleton__form">
    <app-skeleton height="0.75rem" maxWidth="6rem" />
    <app-skeleton height="2.75rem" />
    <app-skeleton height="2.5rem" maxWidth="8rem" />
  </div>
</div>
