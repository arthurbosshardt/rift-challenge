<div class="game-detail-skeleton">
  <div class="game-detail-skeleton__banner">
    <app-skeleton width="7rem" height="1.25rem" radius="999px" />
    <app-skeleton width="5rem" height="1.25rem" radius="999px" />
  </div>

  <ul class="game-detail-skeleton__list">
    @for (row of rows; track row) {
      <li class="game-detail-skeleton__row">
        <app-skeleton class="game-detail-skeleton__rank" width="1.75rem" height="1.75rem" radius="0.375rem" />
        <app-skeleton class="game-detail-skeleton__champion" width="2.25rem" height="2.25rem" radius="0.375rem" />
        <div class="game-detail-skeleton__identity">
          <app-skeleton height="0.875rem" maxWidth="7rem" />
          <app-skeleton height="0.6875rem" maxWidth="4rem" />
        </div>
        <app-skeleton class="game-detail-skeleton__kda" width="2.75rem" height="1.75rem" radius="0.375rem" />
        <div class="game-detail-skeleton__items">
          @for (slot of itemSlots; track slot) {
            <app-skeleton width="1.125rem" height="1.125rem" radius="0.25rem" />
          }
        </div>
      </li>
    }
  </ul>
</div>
