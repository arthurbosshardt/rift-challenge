<div class="player-identity" [class.player-identity--compact]="compact()">
  <app-player-avatar
    [profileIconId]="profileIconId()"
    [gameName]="gameName()"
    [tier]="tier()"
    [size]="compact() ? 'sm' : 'md'"
  />

  <div class="player-identity__text">
    <span class="player-identity__name">{{ gameName() }}</span>
    <span class="player-identity__riot-id">{{ riotId() }}</span>
    @if (rankLabel()) {
      <span class="player-identity__rank-label">{{ rankLabel() }}</span>
    }
  </div>
</div>
