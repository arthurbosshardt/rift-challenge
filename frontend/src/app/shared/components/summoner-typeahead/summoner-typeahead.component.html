<div
  class="summoner-typeahead"
  [class.summoner-typeahead--invalid]="invalid()"
  #root
>
  <div class="summoner-typeahead__field">
    <input
      [name]="name()"
      type="text"
      [ngModel]="value()"
      (ngModelChange)="onInput($event)"
      (keydown.enter)="onEnter($event)"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.aria-invalid]="ariaInvalid()"
      [attr.aria-expanded]="open()"
      aria-autocomplete="list"
      autocomplete="off"
      spellcheck="false"
    />
    @if (showSearchButton()) {
      <button
        type="button"
        class="summoner-typeahead__search-btn"
        (click)="triggerSearch()"
        [disabled]="disabled()"
        [attr.aria-label]="searchAriaLabel()"
      >
        <app-nav-icon name="search" />
      </button>
    }
  </div>
  @if (open() && suggestions().length > 0) {
    <ul
      class="summoner-typeahead__list"
      role="listbox"
      [style.top.px]="dropdownPosition().top"
      [style.left.px]="dropdownPosition().left"
      [style.width.px]="dropdownPosition().width"
    >
      @for (suggestion of suggestions(); track suggestion.puuid) {
        <li>
          <button type="button" class="summoner-typeahead__option" (mousedown)="$event.preventDefault(); pick(suggestion)">
            <app-player-avatar
              [profileIconId]="suggestion.profileIconId"
              [gameName]="suggestion.gameName"
              size="xs"
            />
            <span class="summoner-typeahead__riot-id">{{ suggestion.riotId }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
