<article class="challenge-card-skeleton" [class.challenge-card-skeleton--summary-only]="summaryOnly()">
  <div class="challenge-card-skeleton__layout">
    <div class="challenge-card-skeleton__header">
      <div class="challenge-card-skeleton__title">
        <app-skeleton width="4.75rem" height="1.75rem" radius="999px" />
        <app-skeleton width="4.25rem" height="1.75rem" radius="999px" />
        <app-skeleton class="challenge-card-skeleton__title-name" height="1.35rem" />
      </div>
    </div>

    @if (!summaryOnly()) {
      <div class="challenge-card-skeleton__preview-panel">
        <section class="challenge-card-skeleton__preview">
          <app-skeleton class="challenge-card-skeleton__preview-title" height="0.75rem" maxWidth="6rem" />

          <div class="challenge-card-skeleton__preview-viewport">
            <div class="challenge-card-skeleton__preview-track">
              <ul class="challenge-card-skeleton__preview-column">
                @for (_ of [0, 1, 2]; track _) {
                  <li class="challenge-card-skeleton__preview-item">
                    <app-skeleton width="1.625rem" height="1.625rem" radius="999px" />
                    <div class="challenge-card-skeleton__preview-visual">
                      <app-skeleton width="28px" height="28px" radius="8px" />
                      <app-skeleton [circle]="true" width="32px" height="32px" />
                    </div>
                    <div class="challenge-card-skeleton__preview-text">
                      <app-skeleton height="0.875rem" />
                      <app-skeleton height="0.75rem" maxWidth="75%" />
                    </div>
                    <div class="challenge-card-skeleton__preview-stats">
                      <app-skeleton height="0.75rem" maxWidth="2.5rem" />
                      <app-skeleton height="0.6875rem" maxWidth="3.5rem" />
                    </div>
                  </li>
                }
              </ul>
            </div>
          </div>
        </section>
      </div>
    }

    <div class="challenge-card-skeleton__meta-group">
      <div class="challenge-card-skeleton__meta-full">
        <dl class="challenge-card-skeleton__meta">
          <div class="challenge-card-skeleton__field">
            <app-skeleton height="0.75rem" maxWidth="3.25rem" />
            <app-skeleton height="0.9375rem" maxWidth="6rem" />
          </div>
          <div class="challenge-card-skeleton__field">
            <app-skeleton height="0.75rem" maxWidth="2.75rem" />
            <app-skeleton height="0.9375rem" maxWidth="6rem" />
          </div>
          <div class="challenge-card-skeleton__field">
            <app-skeleton height="0.75rem" maxWidth="5.5rem" />
            <app-skeleton height="0.9375rem" maxWidth="2.5rem" />
          </div>
        </dl>
      </div>

      <div class="challenge-card-skeleton__meta-compact">
        <app-skeleton class="challenge-card-skeleton__meta-compact-dates" height="0.875rem" />
        <app-skeleton height="0.875rem" maxWidth="2.25rem" />
      </div>
    </div>
  </div>
</article>
