<app-page-shell [title]="'home.publicTitle' | t" [subtitle]="'home.publicSubtitle' | t">
  @if (loading()) {
    <app-loader [label]="'home.loading' | t" />
  } @else if (error()) {
    <p class="state state--error">{{ error() }}</p>
  } @else if (races().length === 0) {
    <p class="state">{{ 'home.emptyPublic' | t }}</p>
  } @else {
    <div class="race-grid">
      @for (race of races(); track race.id) {
        <app-race-card [race]="race" />
      }
    </div>
  }
</app-page-shell>
