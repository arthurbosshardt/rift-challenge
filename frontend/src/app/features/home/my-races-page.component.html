<app-page-shell title="Mes races" subtitle="Vos races privées et publiques">
  <div class="toolbar">
    <a routerLink="/races/new" class="create-link">+ Créer une race</a>
  </div>

  @if (loading()) {
    <p class="state">Chargement…</p>
  } @else if (error()) {
    <p class="state state--error">{{ error() }}</p>
  } @else if (races().length === 0) {
    <p class="state">Aucune race pour le moment.</p>
  } @else {
    <div class="race-grid">
      @for (race of races(); track race.id) {
        <app-race-card [race]="race" />
      }
    </div>
  }
</app-page-shell>
