@if (createdChallengesModal.isOpen()) {
  <div
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'home.createdChallengesTitle' | t"
    (click)="close()"
  >
    <section class="modal-panel modal-panel--wide created-challenges-modal" (click)="$event.stopPropagation()">
      <header class="created-challenges-modal__header">
        <h2>
          <app-nav-icon name="created-challenges" />
          <span>{{ 'home.createdChallengesTitle' | t }}</span>
        </h2>
        <button type="button" class="created-challenges-modal__close" [attr.aria-label]="'auth.close' | t" (click)="close()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6L6 18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <div class="created-challenges-modal__body">
        @if (loading()) {
          <app-challenge-list-skeleton [count]="2" [summaryOnly]="true" [ariaLabel]="'home.loading' | t" />
        } @else if (error()) {
          <p class="created-challenges-modal__state created-challenges-modal__state--error">{{ error() }}</p>
        } @else if (challenges().length === 0) {
          <p class="created-challenges-modal__state">{{ 'home.emptyCreated' | t }}</p>
        } @else {
          <div class="created-challenges-modal__grid">
            @for (challenge of challenges(); track challenge.id) {
              <div class="created-challenges-modal__card" (click)="close()">
                <app-challenge-card [challenge]="challenge" [hidePreview]="true" />
              </div>
            }
          </div>
        }
      </div>
    </section>
  </div>
}
