<div class="reset-password" role="main">
  <section class="reset-password__panel modal-panel modal-panel--wide">
    <div class="reset-password__brand">
      <app-brand-logo size="modal-lg" />
      <span class="reset-password__brand-name">{{ 'landing.introBrand' | t }}</span>
    </div>

    @if (verifying()) {
      <div class="reset-password__loading" role="status" [attr.aria-label]="'auth.resetPasswordLoading' | t">
        <app-skeleton width="3rem" height="3rem" radius="999px" />
        <app-skeleton height="1rem" maxWidth="14rem" />
      </div>
    } @else if (linkError()) {
      <h1 class="reset-password__title">{{ 'auth.forgotPasswordTitle' | t }}</h1>
      <p class="error">{{ linkError() }}</p>
      <button type="button" class="reset-password__submit" (click)="openLogin()">
        <app-nav-icon name="login" />
        <span>{{ 'auth.backToLogin' | t }}</span>
      </button>
    } @else {
      <h1 class="reset-password__title">{{ 'auth.resetPasswordTitle' | t }}</h1>
      <p class="reset-password__hint">{{ 'auth.resetPasswordHint' | t }}</p>

      <form (ngSubmit)="submit()">
        <label>
          {{ 'auth.password' | t }}
          <input
            name="password"
            type="password"
            [(ngModel)]="password"
            required
            autocomplete="new-password"
          />
        </label>

        <label>
          {{ 'auth.passwordConfirm' | t }}
          <input
            name="passwordConfirm"
            type="password"
            [(ngModel)]="passwordConfirm"
            required
            autocomplete="new-password"
          />
        </label>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        @if (success()) {
          <p class="success">{{ success() }}</p>
        }

        <button type="submit" class="reset-password__submit" [disabled]="loading() || success() !== null">
          @if (!loading()) {
            <app-nav-icon name="login" />
          }
          <span>{{ loading() ? ('home.loading' | t) : ('auth.submitResetPassword' | t) }}</span>
        </button>
      </form>
    }
  </section>
</div>
