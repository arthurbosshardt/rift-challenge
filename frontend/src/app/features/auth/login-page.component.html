<app-page-shell title="Connexion" subtitle="Accédez à vos races RiftRace">
  <section class="auth-card">
    <div class="auth-card__tabs">
      <button type="button" [class.active]="mode === 'login'" (click)="mode = 'login'">Connexion</button>
      <button type="button" [class.active]="mode === 'signup'" (click)="mode = 'signup'">Inscription</button>
    </div>

    <form (ngSubmit)="submit()">
      @if (mode === 'signup') {
        <label>
          Nom d'utilisateur
          <input name="username" [(ngModel)]="username" required maxlength="64" />
        </label>
      }

      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      <label>
        Mot de passe
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Chargement…' : mode === 'login' ? 'Se connecter' : "S'inscrire" }}
      </button>
    </form>

    <div class="divider">ou</div>

    <button type="button" class="google" [disabled]="googleLoading()" (click)="signInWithGoogle()">
      {{ googleLoading() ? 'Redirection…' : 'Continuer avec Google' }}
    </button>
  </section>
</app-page-shell>
