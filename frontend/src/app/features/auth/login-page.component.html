<app-page-shell [title]="'auth.title' | t" [subtitle]="'auth.subtitle' | t">
  <section class="auth-card">
    <div class="auth-card__tabs">
      <button type="button" [class.active]="mode === 'login'" (click)="mode = 'login'">
        {{ 'auth.loginTab' | t }}
      </button>
      <button type="button" [class.active]="mode === 'signup'" (click)="mode = 'signup'">
        {{ 'auth.signupTab' | t }}
      </button>
    </div>

    <form (ngSubmit)="submit()">
      @if (mode === 'signup') {
        <label>
          {{ 'auth.username' | t }}
          <input name="username" [(ngModel)]="username" required maxlength="64" />
        </label>
      }

      <label>
        {{ 'auth.email' | t }}
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      <label>
        {{ 'auth.password' | t }}
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          [autocomplete]="mode === 'signup' ? 'new-password' : 'current-password'"
        />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? ('home.loading' | t) : mode === 'login' ? ('auth.submitLogin' | t) : ('auth.submitSignup' | t) }}
      </button>
    </form>

    <div class="divider">{{ 'auth.or' | t }}</div>

    <button type="button" class="google" [disabled]="googleLoading()" (click)="signInWithGoogle()">
      {{ googleLoading() ? ('auth.googleRedirect' | t) : ('auth.google' | t) }}
    </button>
  </section>
</app-page-shell>
