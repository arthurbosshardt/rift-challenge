<app-page-shell title="Créer une race" subtitle="Configurez votre nouvelle race">
  <form class="race-form" (ngSubmit)="submit()">
    <label>
      Nom de la race
      <input
        name="name"
        [(ngModel)]="name"
        required
        maxlength="120"
        placeholder="Ex. Race SoloQ été 2026"
      />
    </label>

    <label>
      Type
      <select name="type" [(ngModel)]="type" required>
        <option value="SOLOQ">SoloQ (16 joueurs max)</option>
        <option value="DUOQ">DuoQ (8 duos max)</option>
      </select>
    </label>

    <fieldset class="race-form__datetime">
      <legend>Date et heure de début</legend>
      <div class="race-form__datetime-row">
        <label>
          Date
          <input name="startDate" type="date" [(ngModel)]="startDate" required />
        </label>
        <label>
          Heure
          <select name="startHour" [(ngModel)]="startHour" required>
            @for (hour of hourOptions; track hour) {
              <option [ngValue]="hour">{{ hour }}h</option>
            }
          </select>
        </label>
      </div>
    </fieldset>

    <label class="checkbox">
      <input name="isPublic" type="checkbox" [(ngModel)]="isPublic" />
      Race publique (visible dans la liste publique une fois la race commencée)
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Création…' : 'Créer la race' }}
      </button>
      <a routerLink="/my-races">Annuler</a>
    </div>
  </form>
</app-page-shell>
