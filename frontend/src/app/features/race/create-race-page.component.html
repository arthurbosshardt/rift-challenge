<app-page-shell [title]="'create.title' | t" [subtitle]="'create.subtitle' | t">
  <form class="race-form" (ngSubmit)="submit()">
    <label>
      {{ 'create.name' | t }}
      <input
        name="name"
        [(ngModel)]="name"
        required
        maxlength="120"
        [placeholder]="'create.namePlaceholder' | t"
      />
    </label>

    <label>
      {{ 'create.type' | t }}
      <select name="type" [(ngModel)]="type" required>
        <option value="SOLOQ">{{ 'create.soloq' | t }}</option>
        <option value="DUOQ">{{ 'create.duoq' | t }}</option>
      </select>
    </label>

    <fieldset class="race-form__datetime">
      <legend>{{ 'create.startLegend' | t }}</legend>
      <div class="race-form__datetime-row">
        <label>
          {{ 'create.date' | t }}
          <input name="startDate" type="date" [(ngModel)]="startDate" required />
        </label>
        <label>
          {{ 'create.hour' | t }}
          <select name="startHour" [(ngModel)]="startHour" required>
            @for (hour of hourOptions; track hour) {
              <option [ngValue]="hour">{{ hour }}h</option>
            }
          </select>
        </label>
      </div>
    </fieldset>

    <label class="checkbox">
      <input name="isPublic" type="checkbox" [(ngModel)]="isPublic" />
      {{ 'create.public' | t }}
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" [disabled]="loading()">
        {{ loading() ? ('create.creating' | t) : ('create.submit' | t) }}
      </button>
      <a routerLink="/my-races">{{ 'create.cancel' | t }}</a>
    </div>
  </form>
</app-page-shell>
