<app-page-shell [title]="'create.title' | t" [subtitle]="'create.subtitle' | t">
  <form class="race-form" (ngSubmit)="submit()">
    <label>
      {{ 'create.name' | t }}
      <input
        name="name"
        [(ngModel)]="name"
        required
        maxlength="120"
        [placeholder]="'create.namePlaceholder' | t"
      />
    </label>

    <label>
      {{ 'create.type' | t }}
      <select name="type" [(ngModel)]="type" required>
        <option value="SOLOQ">{{ 'create.soloq' | t }}</option>
        <option value="DUOQ">{{ 'create.duoq' | t }}</option>
      </select>
    </label>

    <fieldset class="race-form__datetime">
      <legend>{{ 'create.startLegend' | t }}</legend>
      <div class="race-form__datetime-row">
        <label>
          {{ 'create.date' | t }}
          <input name="startDate" type="date" [(ngModel)]="startDate" required />
        </label>
        <label>
          {{ 'create.hour' | t }}
          <select name="startHour" [(ngModel)]="startHour" required>
            @for (hour of hourOptions; track hour) {
              <option [ngValue]="hour">{{ hour }}h</option>
            }
          </select>
        </label>
      </div>
    </fieldset>

    <fieldset class="race-form__datetime">
      <legend>{{ 'create.endLegend' | t }}</legend>
      <div class="end-mode" role="group" [attr.aria-label]="'create.endMode' | t">
        <label class="end-mode__option">
          <input name="endMode" type="radio" value="duration" [(ngModel)]="endMode" />
          {{ 'create.endByDuration' | t }}
        </label>
        <label class="end-mode__option">
          <input name="endMode" type="radio" value="date" [(ngModel)]="endMode" />
          {{ 'create.endByDate' | t }}
        </label>
      </div>

      @if (endMode === 'duration') {
        <label>
          {{ 'create.duration' | t }}
          <select name="durationDays" [(ngModel)]="durationDays" required>
            @for (days of durationOptions; track days) {
              <option [ngValue]="days">{{ 'create.durationDays' | t:{ count: days } }}</option>
            }
          </select>
        </label>
      } @else {
        <div class="race-form__datetime-row">
          <label>
            {{ 'create.date' | t }}
            <input name="endDate" type="date" [(ngModel)]="endDate" required />
          </label>
          <label>
            {{ 'create.hour' | t }}
            <select name="endHour" [(ngModel)]="endHour" required>
              @for (hour of hourOptions; track hour) {
                <option [ngValue]="hour">{{ hour }}h</option>
              }
            </select>
          </label>
        </div>
      }
    </fieldset>

    <label class="checkbox">
      <input name="isPublic" type="checkbox" [(ngModel)]="isPublic" />
      {{ 'create.public' | t }}
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" [disabled]="loading()">
        {{ loading() ? ('create.creating' | t) : ('create.submit' | t) }}
      </button>
      <a routerLink="/created-races">{{ 'create.cancel' | t }}</a>
    </div>
  </form>
</app-page-shell>
